<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 8px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #37352f;
  }

  .currency-card {
    max-width: 300px;
    background: #fffaf3;
    border: 1px solid #eadfd3;
    border-radius: 14px;
    padding: 14px 16px;
  }

  .title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .subtitle {
    font-size: 11px;
    color: #8b8580;
    margin-bottom: 13px;
  }

  .conversion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #eee5dc;
  }

  .conversion:last-of-type {
    border-bottom: none;
  }

  .yen {
    font-size: 15px;
    font-weight: 600;
  }

  .pounds {
    font-size: 15px;
    font-weight: 700;
  }

  .rate {
    margin-top: 10px;
    font-size: 10px;
    color: #aaa19a;
  }

  .error {
    color: #b74b4b;
  }
</style>
</head>

<body>

<div class="currency-card">

  <div class="title">💴 Quick Yen Guide</div>
  <div class="subtitle">Handy prices while shopping 🇯🇵</div>

  <div class="conversion">
    <span class="yen">¥1,000</span>
    <span class="pounds" id="yen1000">≈ £—</span>
  </div>

  <div class="conversion">
    <span class="yen">¥5,000</span>
    <span class="pounds" id="yen5000">≈ £—</span>
  </div>

  <div class="conversion">
    <span class="yen">¥10,000</span>
    <span class="pounds" id="yen10000">≈ £—</span>
  </div>

  <div class="rate" id="rateInfo">
    Updating exchange rate…
  </div>

</div>

<script>
async function updateCurrency() {
  try {
    const response = await fetch(
      "https://api.frankfurter.dev/v2/rate/JPY/GBP"
    );

    if (!response.ok) {
      throw new Error("Unable to load exchange rate");
    }

    const data = await response.json();
    const rate = data.rate;

    document.getElementById("yen1000").textContent =
      "≈ £" + (1000 * rate).toFixed(2);

    document.getElementById("yen5000").textContent =
      "≈ £" + (5000 * rate).toFixed(2);

    document.getElementById("yen10000").textContent =
      "≈ £" + (10000 * rate).toFixed(2);

    document.getElementById("rateInfo").textContent =
      "Live rate • Updated " + data.date;

  } catch (error) {
    document.getElementById("rateInfo").innerHTML =
      '<span class="error">Could not load live exchange rate.</span>';
  }
}

updateCurrency();
</script>

</body>
</html>
