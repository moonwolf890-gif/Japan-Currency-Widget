<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 8px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #37352f;
  }

  .card {
    width: 100%;
    max-width: 320px;
    background: #fffaf3;
    border: 1px solid #eadfd3;
    border-radius: 14px;
    padding: 16px;
  }

  .title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .subtitle {
    color: #8b8580;
    font-size: 11px;
    margin-bottom: 14px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    background: white;
    border: 1px solid #e4dbd1;
    border-radius: 10px;
    padding: 9px 11px;
  }

  .symbol {
    font-size: 20px;
    font-weight: 700;
    margin-right: 5px;
  }

  input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 20px;
    font-weight: 700;
    color: #37352f;
  }

  .equals {
    text-align: center;
    color: #aaa19a;
    margin: 8px 0;
    font-size: 14px;
  }

  .result {
    text-align: center;
    background: white;
    border: 1px solid #e4dbd1;
    border-radius: 10px;
    padding: 12px;
    font-size: 23px;
    font-weight: 700;
  }

  .quick {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 11px;
  }

  button {
    border: 1px solid #e4dbd1;
    background: white;
    border-radius: 8px;
    padding: 7px 2px;
    cursor: pointer;
    color: #37352f;
  }

  button:hover {
    background: #f5eee7;
  }

  .rate {
    margin-top: 10px;
    font-size: 10px;
    color: #aaa19a;
    text-align: center;
  }

  .error {
    color: #b74b4b;
  }
</style>
</head>

<body>

<div class="card">

  <div class="title">💴 Yen → Pounds</div>
  <div class="subtitle">Enter any Japanese price 🇯🇵</div>

  <div class="input-wrap">
    <span class="symbol">¥</span>
    <input
      id="yen"
      type="number"
      value="1000"
      min="0"
      step="1"
      placeholder="Enter yen"
    >
  </div>

  <div class="equals">↓ approximately ↓</div>

  <div class="result" id="result">
    £—
  </div>

  <div class="quick">
    <button type="button" data-value="1000">¥1,000</button>
    <button type="button" data-value="5000">¥5,000</button>
    <button type="button" data-value="10000">¥10,000</button>
  </div>

  <div class="rate" id="rate">
    Loading current exchange rate…
  </div>

</div>

<script>
  const yenInput = document.getElementById("yen");
  const result = document.getElementById("result");
  const rateInfo = document.getElementById("rate");

  let jpyToGbp = null;

  async function loadRate() {
    try {
      const response = await fetch(
        "https://api.frankfurter.dev/v2/rate/JPY/GBP"
      );

      if (!response.ok) {
        throw new Error("Rate unavailable");
      }

      const data = await response.json();

      jpyToGbp = data.rate;

      rateInfo.textContent =
        "Live exchange rate • " + data.date;

      calculate();

    } catch (error) {
      result.textContent = "£—";

      rateInfo.innerHTML =
        '<span class="error">Could not load the exchange rate.</span>';
    }
  }

  function calculate() {
    if (!jpyToGbp) return;

    const yen = Number(yenInput.value);

    if (!Number.isFinite(yen) || yen < 0) {
      result.textContent = "£—";
      return;
    }

    const pounds = yen * jpyToGbp;

    result.textContent =
      "£" +
      pounds.toLocaleString("en-GB", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }

  yenInput.addEventListener("input", calculate);

  document.querySelectorAll("button[data-value]").forEach(button => {
    button.addEventListener("click", () => {
      yenInput.value = button.dataset.value;
      calculate();
    });
  });

  loadRate();
</script>

</body>
</html>
